services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collabdocs}
      POSTGRES_USER: ${POSTGRES_USER:-collabdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabdocs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
